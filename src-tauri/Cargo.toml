[package]
name = "morwisko-desktop"
description = "Morwisko desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "morwisko-desktop"

[lib]
name = "morwisko_desktop"
path = "src/lib.rs"

[[bin]]
name = "morwisko-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
morwisko-core = { workspace = true, features = ["watch"] }
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2.7"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-notification = "2.4"
tauri-plugin-autostart = "2.5"

# Giving focus back to the previously active app after quick capture.
[target.'cfg(target_os = "macos")'.dependencies]
# Synchronous, error-reporting notification delivery (see src/notifier.rs); already in the tree via notify-rust.
mac-notification-sys = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
] }

# Signalling the process group of a background agent run (see src/runs/runner.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
# Round-trip test of the TOML quoting of Codex `-c` overrides (src/runs/command.rs).
toml = "0.8"
# Mock runtime for the ACL test (tests/acl.rs).
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "test"] }

[lints]
workspace = true
